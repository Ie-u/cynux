name: Build CYNUX APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK (already installed on the runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "Project settings file: $f"
          test -n "$f" || { echo "settings.gradle.kts NOT FOUND in repo"; ls -R | head -50; exit 1; }
          cd "$(dirname "$f")"
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cynux-apk
          path: "**/build/outputs/apk/release/*.apk"
